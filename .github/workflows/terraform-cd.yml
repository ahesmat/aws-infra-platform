name: Terraform CD

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/environments/dev

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color 2>&1 | tee plan-output.txt
        working-directory: terraform/environments/dev

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/dev/plan-output.txt', 'utf8');
            const truncated = plan.length > 65000 ? plan.substring(0, 65000) + '\n... truncated' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform Plan\n\`\`\`\n${truncated}\n\`\`\``
            });

  bootstrap:
    name: Bootstrap — OIDC + Route53
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    outputs:
      role_arn: ${{ steps.role.outputs.arn }}
      account_id: ${{ steps.account.outputs.id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS with static credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get Account ID
        id: account
        run: |
          echo "id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Create S3 state bucket
        run: |
          BUCKET="tfstate-aws-infra-platform-${{ steps.account.outputs.id }}"
          aws s3api create-bucket --bucket "$BUCKET" --region us-east-1 2>/dev/null || echo "Bucket exists"
          aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
          aws s3api put-public-access-block --bucket "$BUCKET" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws s3api put-bucket-encryption --bucket "$BUCKET" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

      - name: Create DynamoDB lock table
        run: |
          aws dynamodb create-table \
            --table-name terraform-state-lock \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region us-east-1 2>/dev/null || echo "Table exists"

      - name: Update backend.tf
        run: |
          sed -i "s/tfstate-aws-infra-platform-[A-Za-z0-9_]*/tfstate-aws-infra-platform-${{ steps.account.outputs.id }}/" \
            terraform/environments/dev/backend.tf

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: terraform/environments/dev

      - name: Apply OIDC resources
        run: |
          terraform apply \
            -target=aws_iam_openid_connect_provider.github \
            -target=aws_iam_role.github_actions \
            -target=aws_iam_policy.github_actions \
            -target=aws_iam_role_policy_attachment.github_actions \
            -auto-approve
        working-directory: terraform/environments/dev

      - name: Get GitHub Actions role ARN
        id: role
        run: |
          echo "arn=$(terraform output -raw github_actions_role_arn)" >> $GITHUB_OUTPUT
        working-directory: terraform/environments/dev

      - name: Update AWS_ROLE_ARN secret
        run: |
          npm install libsodium-wrappers
          node - << 'SCRIPT'
          const sodium = require('libsodium-wrappers');
          const https = require('https');

          async function updateSecret() {
            await sodium.ready;
            const token = process.env.GH_PAT;
            const owner = 'ahesmat';
            const repo = 'aws-infra-platform';
            const secretName = 'AWS_ROLE_ARN';
            const secretValue = process.env.ROLE_ARN;

            const pubKeyData = await new Promise((resolve, reject) => {
              const options = {
                hostname: 'api.github.com',
                path: `/repos/${owner}/${repo}/actions/secrets/public-key`,
                headers: { 'Authorization': `token ${token}`, 'User-Agent': 'Node.js' }
              };
              https.get(options, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve(JSON.parse(data)));
              }).on('error', reject);
            });

            const key = sodium.from_base64(pubKeyData.key, sodium.base64_variants.ORIGINAL);
            const secretBytes = sodium.from_string(secretValue);
            const encryptedBytes = sodium.crypto_box_seal(secretBytes, key);
            const encryptedValue = sodium.to_base64(encryptedBytes, sodium.base64_variants.ORIGINAL);

            await new Promise((resolve, reject) => {
              const body = JSON.stringify({ encrypted_value: encryptedValue, key_id: pubKeyData.key_id });
              const options = {
                hostname: 'api.github.com',
                path: `/repos/${owner}/${repo}/actions/secrets/${secretName}`,
                method: 'PUT',
                headers: {
                  'Authorization': `token ${token}`,
                  'User-Agent': 'Node.js',
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(body)
                }
              };
              const req = https.request(options, res => {
                res.on('data', () => {});
                res.on('end', resolve);
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });

            console.log('AWS_ROLE_ARN updated to: ' + secretValue);
          }

          updateSecret().catch(console.error);
          SCRIPT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          ROLE_ARN: ${{ steps.role.outputs.arn }}

      - name: Apply Route53 zone
        run: |
          terraform apply -target=aws_route53_zone.main -auto-approve
        working-directory: terraform/environments/dev

      - name: Post NS records and role ARN to summary
        run: |
          echo "## Bootstrap Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitHub Actions Role ARN" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ steps.role.outputs.arn }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Action Required — Update Namecheap DNS" >> $GITHUB_STEP_SUMMARY
          echo "Add these 4 NS records at Namecheap for host \`devops\` under \`reachlyapp.com\`:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          terraform output -json route53_name_servers | jq -r '.[]' | while read ns; do
            echo "- \`$ns\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Once Namecheap is updated, approve the **production** environment gate to proceed." >> $GITHUB_STEP_SUMMARY
        working-directory: terraform/environments/dev

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: bootstrap
    environment: production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.bootstrap.outputs.role_arn }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/environments/dev

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: terraform/environments/dev

      - name: Get Terraform outputs
        id: tf_outputs
        run: |
          echo "instance_id=$(terraform output -raw instance_id)" >> $GITHUB_OUTPUT
          echo "role_arn=$(terraform output -raw github_actions_role_arn)" >> $GITHUB_OUTPUT
          echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT
        working-directory: terraform/environments/dev

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip python3-boto3
          pip3 install boto3 botocore ansible
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/ssm-plugin.deb
          sudo dpkg -i /tmp/ssm-plugin.deb

      - name: Update Ansible inventory
        run: |
          cat > ansible/inventory.ini << INVENTORY
          [ec2]
          ${{ steps.tf_outputs.outputs.instance_id }} ansible_connection=aws_ssm ansible_aws_ssm_region=us-east-1 ansible_aws_ssm_bucket_name=tfstate-aws-infra-platform-${{ steps.tf_outputs.outputs.account_id }} ansible_python_interpreter=/usr/bin/python3
          INVENTORY

      - name: Deploy resume page via Ansible
        run: |
          cd ansible
          ansible-playbook deploy-resume.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

      - name: Deploy CloudWatch agent via Ansible
        run: |
          cd ansible
          ansible-playbook deploy-cloudwatch.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

      - name: Install libsodium
        run: npm install libsodium-wrappers

      - name: Update AWS_ROLE_ARN GitHub secret
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const sodium = require('libsodium-wrappers');
            await sodium.ready;
            const repo = context.repo;
            const { data: publicKey } = await github.rest.actions.getRepoPublicKey({
              owner: repo.owner,
              repo: repo.repo
            });
            const key = sodium.from_base64(publicKey.key, sodium.base64_variants.ORIGINAL);
            const secretValue = '${{ steps.tf_outputs.outputs.role_arn }}';
            const secretBytes = sodium.from_string(secretValue);
            const encryptedBytes = sodium.crypto_box_seal(secretBytes, key);
            const encryptedValue = sodium.to_base64(encryptedBytes, sodium.base64_variants.ORIGINAL);
            await github.rest.actions.createOrUpdateRepoSecret({
              owner: repo.owner,
              repo: repo.repo,
              secret_name: 'AWS_ROLE_ARN',
              encrypted_value: encryptedValue,
              key_id: publicKey.key_id
            });
            console.log('AWS_ROLE_ARN secret updated successfully');
