name: Terraform CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'terraform/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-ci:
    name: Terraform Lint, Validate & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: terraform/environments/dev
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: terraform/environments/dev

      - name: Terraform Validate
        id: validate
        run: terraform validate
        working-directory: terraform/environments/dev

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform/environments/dev
          soft_fail: true

      - name: Post CI summary to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const output = `#### Terraform CI Results
            | Check | Status |
            |-------|--------|
            | Format | ${{ steps.fmt.outcome == 'success' && '✅' || '⚠️' }} ${{ steps.fmt.outcome }} |
            | Validate | ${{ steps.validate.outcome == 'success' && '✅' || '❌' }} ${{ steps.validate.outcome }} |
            | Security Scan | tfsec completed (soft fail) |
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
